<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js?v=5" defer></script>
    <style>
        .galeria-item:hover .galeria-overlay { opacity: 1; }
        .galeria-overlay { opacity: 0; transition: opacity 0.2s; }
    </style>
</head>
<body data-standalone="true">
<div class="flex min-h-screen">
    <aside id="menu-lateral" class="w-64 hidden md:block"></aside>
    <div class="flex-1 flex flex-col md:ml-64 main-content-overlay">

        <!-- Header -->
        <header class="bg-black/80 backdrop-blur-md text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
            <div class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-6 py-4">
                <button onclick="history.back()"
                    class="flex items-center gap-2 text-sm font-bold text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-left text-xs"></i> Voltar
                </button>
                <div id="user-info" class="flex items-center gap-3 text-sm font-semibold ml-auto"></div>
            </div>
        </header>

        <main class="mx-auto max-w-4xl px-4 py-8 w-full flex-1">

            <!-- Carregando -->
            <div id="loading" class="py-20 text-center">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-sky-500 mb-3"></i>
                <p class="text-slate-500">Carregando perfil...</p>
            </div>

            <!-- Não encontrado -->
            <div id="nao-encontrado" class="hidden py-20 text-center">
                <i class="fa-solid fa-user-slash text-5xl text-slate-300 mb-4"></i>
                <p class="text-lg font-bold text-slate-600">Perfil não encontrado.</p>
                <p class="text-sm text-slate-400 mt-2">O link pode estar incorreto ou o perfil foi removido.</p>
                <a href="/pages/fornecedores.html" class="mt-6 inline-block rounded-xl bg-sky-600 px-6 py-3 text-sm font-black text-white hover:bg-sky-700">
                    Ver fornecedores
                </a>
            </div>

            <!-- Perfil carregado -->
            <div id="card-perfil" class="hidden space-y-6">

                <!-- Banner + Foto + Info -->
                <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                    <div class="h-32 bg-gradient-to-r from-slate-900 via-sky-900 to-slate-900"></div>

                    <div class="px-6 pb-6">
                        <div class="flex items-end gap-5 -mt-14 mb-4">
                            <!-- Foto principal -->
                            <div class="w-28 h-28 rounded-2xl border-4 border-white bg-slate-100 overflow-hidden shadow-lg flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-building text-4xl text-slate-300" id="foto-placeholder"></i>
                                <img id="foto-principal" src="" alt="Foto do perfil"
                                     class="hidden w-full h-full object-cover">
                            </div>

                            <div class="flex-1 min-w-0 pt-14">
                                <div class="flex items-start justify-between gap-4 flex-wrap">
                                    <div>
                                        <h1 id="nome-perfil" class="text-2xl font-black text-slate-900"></h1>
                                        <p id="nome-fantasia-perfil" class="hidden text-sm text-slate-500 mt-0.5 font-semibold"></p>
                                        <span id="badge-tipo" class="inline-flex items-center gap-1.5 mt-2 rounded-full px-3 py-1 text-xs font-black"></span>
                                    </div>
                                    <!-- Botão editar (somente para o dono) -->
                                    <a id="btn-editar-perfil" href="/pages/perfil.html"
                                       class="hidden flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2 text-sm font-black text-white hover:bg-sky-700 transition">
                                        <i class="fa-solid fa-pen-to-square"></i> Editar
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Bio -->
                        <div id="bio-container" class="hidden mb-5">
                            <p id="bio-texto" class="text-slate-700 text-sm leading-relaxed whitespace-pre-line"></p>
                        </div>

                        <!-- Info -->
                        <div id="info-rapida" class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-slate-600"></div>
                    </div>
                </div>

                <!-- Galeria -->
                <div id="secao-galeria" class="hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-6">
                    <h2 class="text-base font-black text-slate-800 mb-4">
                        <i class="fa-solid fa-images mr-2 text-sky-600"></i>Galeria
                    </h2>
                    <div id="galeria-grid" class="grid grid-cols-3 gap-3 sm:grid-cols-4 lg:grid-cols-5"></div>
                </div>

                <!-- Produtos (Fornecedor) -->
                <div id="secao-produtos" class="hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-6">
                    <h2 class="text-base font-black text-slate-800 mb-4">
                        <i class="fa-solid fa-boxes-stacked mr-2 text-sky-600"></i>Produtos
                    </h2>
                    <div id="lista-produtos" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
                </div>

                <!-- Informações comerciais (Fornecedor) -->
                <div id="secao-comercial" class="hidden rounded-2xl border border-amber-100 bg-amber-50/50 shadow-sm p-6">
                    <h2 class="text-base font-black text-slate-800 mb-4">
                        <i class="fa-solid fa-handshake mr-2 text-amber-500"></i>Informações comerciais
                    </h2>
                    <div id="info-comercial" class="grid grid-cols-2 gap-4 sm:grid-cols-3"></div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Modal de foto ampliada -->
<div id="modal-foto" class="fixed inset-0 z-[60] hidden bg-black/90 flex items-center justify-center p-4"
     onclick="fecharModalFoto()">
    <img id="modal-foto-img" src="" alt="Foto ampliada"
         class="max-w-full max-h-full rounded-xl object-contain shadow-2xl">
    <button onclick="fecharModalFoto()"
        class="absolute top-4 right-4 text-white text-2xl hover:text-slate-300">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

<script>
'use strict';

let tipoPerfil = null;
let idPerfil   = null;

document.addEventListener('DOMContentLoaded', async () => {
    if (typeof carregarMenuLateral  === 'function') carregarMenuLateral();
    if (typeof exibirInfoUsuario    === 'function') exibirInfoUsuario();
    if (typeof aplicarControlesDeAcesso === 'function') aplicarControlesDeAcesso();

    const params = new URLSearchParams(window.location.search);
    tipoPerfil   = (params.get('tipo') || '').toUpperCase();
    idPerfil     = parseInt(params.get('id'), 10);

    if (!tipoPerfil || !idPerfil || isNaN(idPerfil)) {
        mostrar('nao-encontrado');
        return;
    }

    await carregarPerfil();
});

// ── Carrega e renderiza o perfil ─────────────────────────────────────────────
async function carregarPerfil() {
    mostrar('loading');
    try {
        const endpoint = tipoPerfil === 'FORNECEDOR'
            ? `/api/fornecedores/${idPerfil}/perfil`
            : `/api/clientes/${idPerfil}/perfil`;

        const resp = await fetch(endpoint, { credentials: 'include' });
        if (!resp.ok) { mostrar('nao-encontrado'); return; }

        const dados = await resp.json();
        renderizarPerfil(dados);
        await carregarGaleria();

    } catch (err) {
        console.error(err);
        mostrar('nao-encontrado');
    }
}

function renderizarPerfil(dados) {
    // Nome
    document.getElementById('nome-perfil').textContent = dados.nome || '';

    // Nome fantasia
    if (tipoPerfil === 'FORNECEDOR' && dados.nomeFantasia) {
        const nf = document.getElementById('nome-fantasia-perfil');
        nf.textContent = dados.nomeFantasia;
        nf.classList.remove('hidden');
    }

    // Badge tipo
    const badge = document.getElementById('badge-tipo');
    if (tipoPerfil === 'FORNECEDOR') {
        badge.innerHTML = '<i class="fa-solid fa-truck-fast"></i> Fornecedor';
        badge.className = 'inline-flex items-center gap-1.5 mt-2 rounded-full px-3 py-1 text-xs font-black bg-sky-100 text-sky-700';
    } else {
        badge.innerHTML = '<i class="fa-solid fa-user"></i> Cliente';
        badge.className = 'inline-flex items-center gap-1.5 mt-2 rounded-full px-3 py-1 text-xs font-black bg-indigo-100 text-indigo-700';
    }

    // Ícone placeholder
    if (tipoPerfil === 'CLIENTE') {
        document.getElementById('foto-placeholder').className = 'fa-solid fa-user text-4xl text-slate-300';
    }

    // Foto principal
    if (dados.temFoto) {
        carregarFotoPrincipal();
    }

    // Bio
    if (dados.bio && dados.bio.trim()) {
        document.getElementById('bio-texto').textContent = dados.bio;
        document.getElementById('bio-container').classList.remove('hidden');
    }

    // Info rápida
    const infos = [];
    if (dados.cidade || dados.estado) {
        infos.push(`<span><i class="fa-solid fa-location-dot mr-1 text-sky-500"></i>${esc([dados.cidade, dados.estado].filter(Boolean).join(', '))}</span>`);
    }
    if (dados.email) {
        infos.push(`<a href="mailto:${esc(dados.email)}" class="hover:text-sky-600"><i class="fa-solid fa-envelope mr-1 text-sky-500"></i>${esc(dados.email)}</a>`);
    }
    if (dados.telefone) {
        infos.push(`<span><i class="fa-solid fa-phone mr-1 text-sky-500"></i>${esc(dados.telefone)}</span>`);
    }
    if (tipoPerfil === 'FORNECEDOR' && dados.site) {
        infos.push(`<a href="${esc(dados.site)}" target="_blank" rel="noopener" class="text-sky-600 hover:underline"><i class="fa-solid fa-globe mr-1"></i>${esc(dados.site)}</a>`);
    }
    if (tipoPerfil === 'CLIENTE' && dados.segmento) {
        infos.push(`<span><i class="fa-solid fa-briefcase mr-1 text-sky-500"></i>${esc(dados.segmento)}</span>`);
    }
    document.getElementById('info-rapida').innerHTML = infos.join('');

    // Produtos
    if (tipoPerfil === 'FORNECEDOR' && dados.produtos && dados.produtos.length > 0) {
        renderizarProdutos(dados.produtos);
        // Info comercial
        renderizarInfoComercial(dados);
    }

    // Botão "Editar" visível apenas para o dono
    const usuarioJson = localStorage.getItem('usuario');
    if (usuarioJson) {
        const usuario = JSON.parse(usuarioJson);
        const cnpjOuCpf = (usuario.cnpjOuCpf || '').replaceAll(/\D/g, '');
        // Verifica pelo cnpj/cpf ou por tipo ADMIN
        if (usuario.tipo === 'ADMIN' || usuario.tipo === 'MANUTENCAO' || usuario.tipo === 'EDICAO') {
            document.getElementById('btn-editar-perfil').classList.remove('hidden');
        } else {
            // Tenta comparar pelo dado do perfil
            const docPerfil = (dados.cnpjMascarado || '').replace(/\D/g, '');
            // Para Fornecedor, não expomos o CNPJ completo no perfil público — botão só no perfil próprio
            if (usuario.fornecedor && tipoPerfil === 'FORNECEDOR') {
                document.getElementById('btn-editar-perfil').classList.remove('hidden');
            } else if (usuario.cliente && tipoPerfil === 'CLIENTE') {
                document.getElementById('btn-editar-perfil').classList.remove('hidden');
            }
        }
    }

    mostrar('card-perfil');
}

async function carregarFotoPrincipal() {
    try {
        const endpoint = tipoPerfil === 'FORNECEDOR'
            ? `/api/fornecedores/${idPerfil}/foto`
            : `/api/clientes/${idPerfil}/foto`;

        const resp = await fetch(endpoint, { credentials: 'include' });
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.foto) {
            document.getElementById('foto-placeholder').classList.add('hidden');
            const img = document.getElementById('foto-principal');
            img.src = 'data:image/jpeg;base64,' + data.foto;
            img.classList.remove('hidden');
        }
    } catch (e) { /* silencioso */ }
}

// ── Galeria ──────────────────────────────────────────────────────────────────
async function carregarGaleria() {
    try {
        const resp = await fetch(`/api/perfil/fotos/${tipoPerfil}/${idPerfil}`, { credentials: 'include' });
        if (!resp.ok) return;
        const fotos = await resp.json();
        if (!fotos || fotos.length === 0) return;

        const secao = document.getElementById('secao-galeria');
        const grid  = document.getElementById('galeria-grid');
        secao.classList.remove('hidden');

        grid.innerHTML = fotos.map(foto => `
            <div class="relative galeria-item aspect-square rounded-xl overflow-hidden bg-slate-100 cursor-pointer"
                 onclick="abrirFoto(${foto.id})">
                <img src="" alt="${esc(foto.fotoNome || '')}"
                     data-foto-id="${foto.id}"
                     loading="lazy"
                     class="w-full h-full object-cover"
                     onerror="carregarBase64(this, ${foto.id})">
                ${foto.legenda
                    ? `<div class="galeria-overlay absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1.5">
                           <p class="text-white text-[11px] font-semibold truncate">${esc(foto.legenda)}</p>
                       </div>`
                    : ''}
            </div>`).join('');

        // Inicia carregamento lazy das imagens
        grid.querySelectorAll('img[data-foto-id]').forEach(img => {
            carregarBase64(img, parseInt(img.dataset.fotoId));
        });

    } catch (err) { /* silencioso */ }
}

async function carregarBase64(imgEl, fotoId) {
    try {
        const resp = await fetch(`/api/perfil/fotos/${tipoPerfil}/${idPerfil}/${fotoId}/imagem`, { credentials: 'include' });
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.foto) imgEl.src = 'data:image/jpeg;base64,' + data.foto;
    } catch (e) { /* silencioso */ }
}

async function abrirFoto(fotoId) {
    const resp = await fetch(`/api/perfil/fotos/${tipoPerfil}/${idPerfil}/${fotoId}/imagem`, { credentials: 'include' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.foto) {
        document.getElementById('modal-foto-img').src = 'data:image/jpeg;base64,' + data.foto;
        document.getElementById('modal-foto').classList.remove('hidden');
    }
}

function fecharModalFoto() {
    document.getElementById('modal-foto').classList.add('hidden');
    document.getElementById('modal-foto-img').src = '';
}

// ── Produtos ─────────────────────────────────────────────────────────────────
function renderizarProdutos(produtos) {
    const secao = document.getElementById('secao-produtos');
    const lista = document.getElementById('lista-produtos');
    secao.classList.remove('hidden');

    lista.innerHTML = produtos.map(p => `
        <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md transition hover:-translate-y-0.5">
            <h3 class="font-black text-slate-800 text-sm">${esc(p.nome)}</h3>
            ${p.descricao ? `<p class="mt-1 text-xs text-slate-500 line-clamp-2">${esc(p.descricao)}</p>` : ''}
            <div class="mt-3 flex items-center justify-between gap-2">
                ${p.preco ? `<span class="text-sm font-black text-sky-700">R$ ${Number(p.preco).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>` : '<span class="text-sm text-slate-400">Consultar preço</span>'}
                <span class="rounded-full bg-sky-50 px-2 py-0.5 text-[10px] font-bold text-sky-600">${esc(p.categoria)}</span>
            </div>
        </article>`).join('');
}

function renderizarInfoComercial(dados) {
    const secao = document.getElementById('secao-comercial');
    const el    = document.getElementById('info-comercial');
    const itens = [];

    if (dados.categoria) itens.push({ label: 'Categoria', valor: dados.categoria, icone: 'fa-tag' });
    if (dados.atividade) itens.push({ label: 'Atividade', valor: dados.atividade, icone: 'fa-briefcase' });

    if (itens.length === 0) return;
    secao.classList.remove('hidden');
    el.innerHTML = itens.map(i => `
        <div class="rounded-xl bg-white border border-amber-100 p-3">
            <p class="text-[10px] font-black uppercase tracking-widest text-amber-500 mb-1">
                <i class="fa-solid ${i.icone} mr-1"></i>${i.label}
            </p>
            <p class="text-sm font-bold text-slate-700">${esc(i.valor)}</p>
        </div>`).join('');
}

// ── Utilitários ───────────────────────────────────────────────────────────────
function mostrar(elementId) {
    ['loading', 'nao-encontrado', 'card-perfil'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(elementId).classList.remove('hidden');
}

const esc = v => {
    const el = document.createElement('span');
    el.textContent = String(v || '');
    return el.innerHTML;
};
</script>
</body>
</html>
