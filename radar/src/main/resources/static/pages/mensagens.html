<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens - Radar Fornecedor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .conversa-item:hover {
            background-color: #f3f4f6;
            cursor: pointer;
        }
        .conversa-nao-lida {
            background-color: #eff6ff;
        }
        .badge-nao-lidas {
            min-width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #menu-mensagens {
            background-color: #1e293b !important;
            color: white !important;
        }
    </style>
</head>
<body data-standalone="true" class="bg-gray-50">

    <!-- Container principal -->
    <div class="flex min-h-screen">
        <!-- Menu Lateral -->
        <aside id="menu-lateral" class="w-64 hidden md:block"></aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 md:ml-64 p-8">
            <div class="max-w-5xl mx-auto">
                
                <!-- Cabeçalho -->
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
                            <i class="fas fa-comments text-blue-600"></i>
                            Mensagens
                        </h1>
                        <p class="text-gray-600 mt-2">Conversas comerciais com fornecedores e clientes</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <!-- Badge total não lidas -->
                        <div id="total-nao-lidas-badge" class="hidden px-4 py-2 bg-red-500 text-white rounded-full font-bold">
                            <i class="fas fa-envelope"></i>
                            <span id="total-nao-lidas-texto">0</span>
                        </div>
                    </div>
                </div>

                <!-- Barra de Pesquisa -->
                <div class="mb-6">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="pesquisa-conversas"
                               placeholder="Pesquisar conversas..."
                               class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Lista de Conversas -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div id="lista-conversas" class="divide-y divide-gray-200">
                        <!-- Loading -->
                        <div id="conversas-loading" class="p-8 text-center">
                            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                            <p class="text-gray-600">Carregando conversas...</p>
                        </div>

                        <!-- Vazio -->
                        <div id="conversas-vazio" class="hidden p-12 text-center">
                            <i class="fas fa-comments text-6xl text-gray-300 mb-4"></i>
                            <p class="text-xl font-semibold text-gray-700 mb-2">Nenhuma conversa ainda</p>
                            <p class="text-gray-500">Inicie uma conversa a partir do perfil de um fornecedor ou produto</p>
                        </div>

                        <!-- Erro -->
                        <div id="conversas-erro" class="hidden p-8 text-center">
                            <i class="fas fa-exclamation-circle text-4xl text-red-600 mb-4"></i>
                            <p class="text-gray-600">Erro ao carregar conversas. Tente novamente.</p>
                            <button onclick="carregarConversas()" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                <i class="fas fa-redo"></i> Tentar Novamente
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/comum.js"></script>
    <script src="/js/mensagens.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarMenuLateral();
            await exibirInfoUsuario();
            await aplicarControlesDeAcesso();
            await carregarConversas();
            configurarPesquisa();
        });
    </script>
</body>
</html>
