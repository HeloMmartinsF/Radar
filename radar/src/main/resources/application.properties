# Configurações de conexão com o banco de dados H2 (PERSISTENTE EM ARQUIVO)
# IMPORTANTE: file: força persistência no disco
spring.datasource.url=jdbc:h2:file:./DBLRadar;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações adicionais de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desabilitar carregamento automático de schema.sql e data.sql
spring.sql.init.mode=never

# Porta do servidor
server.port=8080

# Desabilitar cache de recursos estáticos (JS, CSS, HTML)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# H2 Console (para visualizar o banco de dados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
